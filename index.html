<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contador de Cliques</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="card">
    <p class="tag">MEU PRIMEIRO PROJETO NO GITHUB</p>
    <h1>Contador de Cliques</h1>
    <p class="subtitle">Clique no botão e veja o número crescer.</p>
    <div id="contador" class="contador" aria-live="polite">0</div>
    <div class="botoes">
      <button id="adicionar">+1 clique</button>
      <button id="resetar" class="secundario">Zerar</button>
    </div>
    <p id="mensagem" class="mensagem">Você ainda não clicou. Comece agora!</p>
  </main>
  <script src="script.js"></script>
</body>
</html>
